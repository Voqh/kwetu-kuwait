<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kwetu logo comparison</title>
<style>
  body { margin: 0; padding: 32px; background: #F3ECE0; color: #241F1B; font-family: 'Work Sans', sans-serif; }
  main { max-width: 820px; margin: 0 auto; }
  h1 { margin: 0 0 24px; font-family: 'Space Grotesk', sans-serif; font-size: 26px; }
  .comparison { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
  figure { margin: 0; }
  .artwork { display: grid; place-items: center; min-height: 330px; padding: 24px; background: #FFFDF9; border: 1px solid rgba(36, 31, 27, 0.12); }
  img { display: block; max-width: 100%; max-height: 280px; object-fit: contain; }
  figcaption { margin-top: 10px; font-family: monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #124F4A; }
  @media (max-width: 640px) { body { padding: 20px; } .comparison { grid-template-columns: 1fr; } .artwork { min-height: 260px; } }
</style>
</head>
<body>
<main>
  <h1>Kwetu logo comparison</h1>
  <div class="comparison">
    <figure><div class="artwork"><img src="logo-reference.png" alt="Supplied logo reference"></div><figcaption>Reference</figcaption></figure>
    <figure><div class="artwork"><img src="logo.svg" alt="Generated Kwetu doorway logo"></div><figcaption>Generated SVG</figcaption></figure>
  </div>
</main>
</body>
</html>
