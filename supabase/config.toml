# Supabase configuration for Kwetu Kuwait

# API configuration
[api]
enabled = true

# Database configuration  
[db]
major_version = 15

# Studio configuration
[studio]
enabled = true

# Functions configuration
[functions.purge-listings]
verify_jwt = false  # Scheduled function, no JWT needed
scheduling = ["0 3 * * *"]  # Daily at 3 AM UTC

[functions.moderation]
verify_jwt = false  # Uses custom admin-secret header

[functions.export-reports]
verify_jwt = false  # Uses custom admin-secret header
