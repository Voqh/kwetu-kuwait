[build]
publish = "."

[functions]
directory = "netlify/functions"

[functions.purge-listings]
schedule = "0 3 * * *"

# Security headers
[[headers]]
for = "/*"
[headers.values]
  Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
  X-Content-Type-Options = "nosniff"
  X-Frame-Options = "DENY"
  X-XSS-Protection = "1; mode=block"
  Referrer-Policy = "no-referrer-when-downgrade"
  Permissions-Policy = "geolocation=(), microphone=(), camera=()"
  Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co; frame-ancestors 'none';"

# Cache control for static assets
[[headers]]
for = "/*.{js,css,svg,png,jpg,jpeg,gif,ico,woff,woff2}"
[headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

# HTML files: no caching (allows updates to propagate quickly)
[[headers]]
for = "/*.html"
[headers.values]
  Cache-Control = "public, max-age=3600, must-revalidate"

# Sitemap: serve as XML with correct content-type
[[headers]]
for = "/sitemap.xml"
[headers.values]
  Content-Type = "application/xml; charset=utf-8"
  Cache-Control = "public, max-age=3600"

# robots.txt: serve as text/plain
[[headers]]
for = "/robots.txt"
[headers.values]
  Content-Type = "text/plain; charset=utf-8"
  Cache-Control = "public, max-age=86400"
